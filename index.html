    const url = RAW_URL.replace('?t='+Date.now().toString().slice(0,-3)+'000','') + '?nc=' + Date.now();
    const r = await fetch('https://gist.githubusercontent.com/HectorBrillante/895b12b14bb63ad695a4cb7858b4decd/raw/backlog-bpt.json'.replace(/$/,'?nc='+Date.now()));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const p = await r.json();
    items   = (p.items && p.items.length > 0) ? p.items : DEF;
    comments = p.comments || [];
    ss('ok','Sincronizado · '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}));
    render();
  } catch(ex) {
    console.error('fetchData error:', ex);
    ss('er','Sin conexión — datos locales');
    if(items.length===0){ items=DEF; comments=[]; render(); }
  }
}

function gf(){ return items.filter(i=>(fp==='todas'||i.prio===fp)&&(fe==='todos'||i.est===fe)); }
function cfi(id){ return comments.filter(c=>c.itemId===id); }
function e(s){ return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){
  const t=document.getElementById('to');
  t.textContent=m; t.classList.add('vi');
  setTimeout(()=>t.classList.remove('vi'),2500);
}

function setV(v,btn){
  vw=v;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ['vk','vb','vc'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display='none';
  });
  document.getElementById('v'+v).style.display='block';
  render();
}

function renderKPI(){
  const c=est=>items.filter(i=>i.est===est).length;
  document.getElementById('kpi').innerHTML=
    `<div class="kp"><div class="kv">${items.length}</div><div class="kl">Total</div></div>`+
    `<div class="kp kd"><div class="kv">${c('vencido')}</div><div class="kl">Vencidos</div></div>`+
    `<div class="kp kw"><div class="kv">${c('pendiente')}</div><div class="kl">Pendientes</div></div>`+
    `<div class="kp ka"><div class="kv">${c('proceso')}</div><div class="kl">En proceso</div></div>`+
    `<div class="kp kpp"><div class="kv">${c('bloqueado')}</div><div class="kl">Bloqueados</div></div>`+
    `<div class="kp ks"><div class="kv">${c('completo')}</div><div class="kl">Completados</div></div>`;
}

// Kanban: onclick con id escapado correctamente
function renderK(){
  const fi = gf();
  const board = document.getElementById('vk');
  board.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'kb';
  COLS.forEach(col => {
    const ci = fi.filter(i=>i.est===col.id);
    const colEl = document.createElement('div');
    colEl.className = 'kc '+col.c;
    const head = `<div class="kch">${col.l}<span class="kcc">${ci.length}</span></div>`;
    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'kcs';
    ci.forEach(item => {
      const cc = cfi(item.id);
      const card = document.createElement('div');
      card.className = 'kk';
      card.dataset.p = item.prio;
      card.innerHTML =
        `<div class="kn">${e(item.num)}</div>`+
        `<div class="kt">${e(item.title)}</div>`+
        `<div class="kd2">${e(item.desc)}</div>`+
        `<div class="kf"><span class="pi p${item.prio[0]}">${item.prio}</span><span class="pf">${e(item.fecha)}</span></div>`+
        (item.nota?`<div class="kno">📝 ${e(item.nota)}</div>`:'')+
        (cc.length?`<div class="kcm">💬 ${cc.length} comentario${cc.length>1?'s':''}</div>`:'');
      // closure correcta con variable local
      const itemId = item.id;
      card.addEventListener('click', ()=>openItem(itemId));
      cardsWrap.appendChild(card);
    });
    const addBtn = document.createElement('button');
    addBtn.className='ah'; addBtn.textContent='+ Agregar aquí';
    const colId = col.id;
    addBtn.addEventListener('click', ()=>newInCol(colId));
    colEl.innerHTML = head;
    colEl.appendChild(cardsWrap);
    colEl.appendChild(addBtn);
    wrap.appendChild(colEl);
  });
  board.appendChild(wrap);
}

function renderB(){
  const fi=gf();
  const head=`<div class="bh"><span>#</span><span>Título / Nota</span><span>Responsable</span><span>Fecha</span><span>Estatus</span><span>Prior.</span></div>`;
  const rows=fi.map(item=>{
    const cc=cfi(item.id);
    const estCls=estClass(item.est);
    return `<div class="br" data-id="${item.id}">
      <div class="bn">${item.num}</div>
      <div><div class="bt">${e(item.title)}</div>
        ${item.nota?`<div class="bsub">📝 ${e(item.nota)}</div>`:''}
        ${cc.length?`<div class="bsubc">💬 ${cc.length} comentario${cc.length>1?'s':''}</div>`:''}
      </div>
      <div class="bres">${e(item.resp)}</div>
      <div class="bfe">${e(item.fecha)}</div>
      <div><span class="spl ${estCls}">${EL[item.est]||item.est}</span></div>
      <div><span class="pi p${item.prio[0]}">${item.prio}</span></div>
    </div>`;
  }).join('');
  const bl=document.getElementById('vb');
  bl.innerHTML='<div class="bl">'+head+rows+'</div>';
  // Attach events after render
  bl.querySelectorAll('.br').forEach(row=>{
    row.style.cursor='pointer';
    row.addEventListener('click',()=>openItem(row.dataset.id));
  });
}

function estClass(est){
  const m={vencido:'sv',pendiente:'spe',proceso:'se',bloqueado:'sbl',completo:'sc'};
  return m[est]||'spe';
}

function setFP(p,btn){
  fp=p;
  document.querySelectorAll('.fi .fbp').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render();
}
function setFE(ev,btn){
  fe=ev;
  document.querySelectorAll('.fi .fbe').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render();
}

function openItem(id){
  eid=id;
  const it=items.find(i=>i.id===id);
  if(!it)return;
  document.getElementById('mtit').textContent='Editar — '+it.num;
  document.getElementById('ft').value=it.title;
  document.getElementById('fd2').value=it.desc;
  document.getElementById('fr').value=it.resp;
  document.getElementById('ff').value=it.fecha;
  document.getElementById('fp2').value=it.prio;
  document.getElementById('fn').value=it.nota||'';
  est=it.est;
  document.getElementById('bdel').style.display='block';
  document.querySelectorAll('.eb').forEach(b=>b.classList.toggle('on',b.dataset.e===est));
  const cc=cfi(id);
  document.getElementById('mcl').innerHTML=cc.length
    ?cc.map(c=>`<div class="ci"><div class="cia">💬 ${e(c.autor)}</div><div class="cit">${e(c.texto)}</div><div class="cid">${c.fecha}</div></div>`).join('')

function saveI(){
  const t=document.getElementById('ft').value.trim();
  if(!t)return;
  if(eid){
    const ix=items.findIndex(i=>i.id===eid);
    items[ix]={...items[ix],title:t,desc:document.getElementById('fd2').value.trim(),
      resp:document.getElementById('fr').value.trim(),fecha:document.getElementById('ff').value.trim(),
      prio:document.getElementById('fp2').value,est,nota:document.getElementById('fn').value.trim()};
  }else{
    const n=items.reduce((m,i)=>Math.max(m,parseInt(i.num?.replace('#','')||0)),0)+1;
    items.push({id:'c'+n+'_'+Date.now(),num:'#'+String(n).padStart(2,'0'),title:t,
      desc:document.getElementById('fd2').value.trim(),resp:document.getElementById('fr').value.trim(),
      fecha:document.getElementById('ff').value.trim(),prio:document.getElementById('fp2').value,est,
      nota:document.getElementById('fn').value.trim()});
  }
  closeM();
  pushData().then(()=>render());
}
function delI(){
  if(!eid||!confirm('¿Eliminar este item?'))return;
  items=items.filter(i=>i.id!==eid);
  comments=comments.filter(c=>c.itemId!==eid);
  closeM(); pushData().then(()=>render());
}
