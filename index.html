<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backlog RH — BPT · Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F1F5C;--blue:#1A50C8;--sky:#00AEEF;
  --ink:#111827;--muted:#6B7280;--border:#E5E7EB;
  --bg:#F7F8FC;--white:#FFFFFF;--r:8px;
  --danger:#DC2626;--danger-bg:#FEF2F2;
  --warn:#D97706;--warn-bg:#FFFBEB;
  --acc:#1A50C8;--acc-bg:#EFF6FF;
  --pro:#7C3AED;--pro-bg:#F5F3FF;
  --suc:#059669;--suc-bg:#ECFDF5;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:13px}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.tl{display:flex;flex-direction:column;gap:2px}
.t-emp{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;opacity:.7}
.t-ttl{font-size:18px;font-weight:800}
.t-sub{font-size:11px;opacity:.7}
.tr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;white-space:nowrap}
.chip.red{background:rgba(220,38,38,.3)}

/* SYNC BAR */
.syncbar{background:var(--white);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--suc)}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.syncbar-btns{display:flex;gap:6px}
.btn{padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border-radius:var(--r);border:1px solid var(--border);background:var(--white);color:var(--muted);display:flex;align-items:center;gap:4px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}
.btn.primary:hover{background:var(--blue)}

/* KPI */
.kpi-row{padding:10px 20px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;text-align:center}
.kpi-v{font-size:22px;font-weight:900;line-height:1}
.kpi-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:1px}
.kd .kpi-v{color:var(--danger)}.kw .kpi-v{color:var(--warn)}.ka .kpi-v{color:var(--acc)}.kp .kpi-v{color:var(--pro)}.ks .kpi-v{color:var(--suc)}

/* TABS */
.tabs{display:flex;padding:0 20px;gap:2px;border-bottom:1px solid var(--border);background:var(--white)}
.tab{padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);display:flex;align-items:center;gap:5px}
.tab.active{color:var(--navy);border-bottom-color:var(--navy)}

/* FILTROS */
.filters{padding:8px 20px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--border);background:var(--white);flex-wrap:wrap}
.flbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.fbtn{padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--white);color:var(--muted)}
.fbtn.on{background:var(--navy);color:white;border-color:var(--navy)}
.sep{width:1px;height:20px;background:var(--border)}

/* KANBAN */
.kanban{padding:12px 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
.kcol{display:flex;flex-direction:column}
.kcol-h{padding:7px 10px;border-radius:var(--r);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kcol-cnt{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700}
.kc-vencido .kcol-h{background:var(--danger-bg);color:var(--danger)}
.kc-pendiente .kcol-h{background:var(--warn-bg);color:var(--warn)}
.kc-proceso .kcol-h{background:var(--acc-bg);color:var(--acc)}
.kc-bloqueado .kcol-h{background:var(--pro-bg);color:var(--pro)}
.kc-completo .kcol-h{background:var(--suc-bg);color:var(--suc)}
.kcol-cards{display:flex;flex-direction:column;gap:6px;min-height:80px}
.kcard{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:9px 10px;cursor:pointer;transition:border-color .1s;border-left:3px solid transparent}
.kcard:hover{border-color:var(--blue)}
.kcard[data-prio=alta]{border-left-color:var(--danger)}
.kcard[data-prio=media]{border-left-color:var(--warn)}
.kcard[data-prio=baja]{border-left-color:var(--suc)}
.kcard-num{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:2px}
.kcard-title{font-size:11px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:4px}
.kcard-desc{font-size:10px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.kcard-foot{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pill{font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px}
.p-alta{background:var(--danger-bg);color:var(--danger)}
.p-media{background:var(--warn-bg);color:var(--warn)}
.p-baja{background:var(--suc-bg);color:var(--suc)}
.p-fecha{font-size:9px;color:var(--muted);margin-left:auto}
.kcard-nota{font-size:9px;color:var(--acc);background:var(--acc-bg);border-radius:4px;padding:2px 5px;margin-top:4px}
.kcard-cmts{font-size:9px;color:var(--pro);display:flex;align-items:center;gap:3px;margin-top:3px}
.add-here{width:100%;margin-top:5px;padding:5px;font-size:10px;color:var(--muted);background:none;border:1px dashed var(--border);border-radius:var(--r);cursor:pointer}
.add-here:hover{background:var(--bg)}

/* BACKLOG */
.backlog{padding:12px 20px;display:flex;flex-direction:column;gap:5px}
.bhead{display:grid;grid-template-columns:36px 1fr 100px 90px 110px 80px;gap:8px;padding:4px 10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.brow{display:grid;grid-template-columns:36px 1fr 100px 90px 110px 80px;gap:8px;align-items:center;padding:8px 10px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:border-color .1s}
.brow:hover{border-color:var(--blue)}
.brow-n{font-size:10px;color:var(--muted);font-weight:700;text-align:center}
.brow-t{font-size:12px;font-weight:600;color:var(--ink)}
.brow-sub{font-size:10px;color:var(--acc);margin-top:2px}
.brow-resp{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow-fecha{font-size:10px;color:var(--muted)}
.spl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;display:inline-block}
.s-vencido{background:var(--danger-bg);color:var(--danger)}
.s-pendiente{background:var(--warn-bg);color:var(--warn)}
.s-proceso{background:var(--acc-bg);color:var(--acc)}
.s-bloqueado{background:var(--pro-bg);color:var(--pro)}
.s-completo{background:var(--suc-bg);color:var(--suc)}

/* COMENTARIOS PANEL */
.cmts-panel{padding:10px 20px;display:flex;flex-direction:column;gap:8px}
.cmt-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.cmt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cmt-item-ref{font-size:11px;font-weight:700;color:var(--navy)}
.cmt-meta{font-size:10px;color:var(--muted)}
.cmt-author{font-size:10px;font-weight:700;color:var(--pro);background:var(--pro-bg);padding:1px 6px;border-radius:8px}
.cmt-text{font-size:12px;color:var(--ink);line-height:1.5}
.no-cmts{text-align:center;padding:40px;color:var(--muted);font-size:12px}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:12px;padding:20px;width:480px;max-width:96vw;max-height:88vh;overflow-y:auto;border:1px solid var(--border)}
.modal h3{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:14px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;font-family:inherit;background:var(--bg)}
.fld textarea{min-height:56px;resize:vertical}
.est-row{display:flex;gap:5px;flex-wrap:wrap}
.ebtn{padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);border-radius:var(--r);background:var(--white);color:var(--muted)}
.ebtn.on{outline:2px solid var(--navy);outline-offset:1px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.mbtns button{padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;border-radius:var(--r)}
.b-cancel{background:var(--white);color:var(--muted);border:1px solid var(--border)}
.b-save{background:var(--navy);color:white;border:none}
.b-del{background:var(--danger-bg);color:var(--danger);border:1px solid #FECACA;margin-right:auto}

/* Comentarios en modal */
.cmt-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.cmt-section h4{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.cmt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;max-height:150px;overflow-y:auto}
.cmt-item{background:var(--pro-bg);border-radius:var(--r);padding:7px 10px}
.cmt-item-author{font-size:9px;font-weight:700;color:var(--pro);margin-bottom:2px}
.cmt-item-text{font-size:11px;color:var(--ink);line-height:1.4}
.cmt-item-date{font-size:9px;color:var(--muted);margin-top:2px}
.no-cmt{font-size:11px;color:var(--muted);font-style:italic}

.toast{position:fixed;bottom:16px;right:16px;background:var(--navy);color:white;border-radius:var(--r);padding:8px 14px;font-size:11px;font-weight:700;display:none;z-index:999}
.toast.vis{display:block}

@media(max-width:700px){
  .kanban{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .bhead,.brow{grid-template-columns:28px 1fr 80px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tl">
    <div class="t-emp">Bebidas Purificadas de Tehuacán · Gerencia RH</div>
    <div class="t-ttl">📋 Backlog RH — Editor</div>
    <div class="t-sub">Lic. Héctor Mota Altamirano · Semana 29 Jun 2026</div>
  </div>
  <div class="tr">
    <div class="chip red" id="chip-vencidos">🔴 2 Vencidos</div>
    <div class="chip" id="chip-bloqueados">🚫 3 Bloqueados</div>
    <div class="chip">📅 Martes · KPIs</div>
  </div>
</div>

<div class="syncbar">
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-txt">Cargando datos...</span>
  </div>
  <div class="syncbar-btns">
    <button class="btn" onclick="syncNow()">↻ Sincronizar</button>
    <button class="btn primary" onclick="openModal(null)">+ Nuevo item</button>
  </div>
</div>

<div class="kpi-row" id="kpi-row"></div>

<div class="tabs">
  <div class="tab active" onclick="setView('kanban',this)">⬛ Kanban</div>
  <div class="tab" onclick="setView('backlog',this)">☰ Backlog</div>
  <div class="tab" onclick="setView('comentarios',this)">💬 Comentarios <span id="cmt-badge" style="background:var(--pro-bg);color:var(--pro);border-radius:8px;padding:1px 6px;font-size:10px;margin-left:4px">0</span></div>
</div>

<div class="filters">
  <span class="flbl">Prioridad:</span>
  <button class="fbtn on" onclick="setF('todas',this)">Todas</button>
  <button class="fbtn" onclick="setF('alta',this)">Alta</button>
  <button class="fbtn" onclick="setF('media',this)">Media</button>
  <button class="fbtn" onclick="setF('baja',this)">Baja</button>
  <div class="sep"></div>
  <span class="flbl">Estatus:</span>
  <button class="fbtn" onclick="setFE('todos',this)">Todos</button>
  <button class="fbtn" onclick="setFE('vencido',this)">Vencidos</button>
  <button class="fbtn" onclick="setFE('pendiente',this)">Pendientes</button>
  <button class="fbtn" onclick="setFE('bloqueado',this)">Bloqueados</button>
  <button class="fbtn" onclick="setFE('completo',this)">Completados</button>
</div>

<div id="view-kanban"></div>
<div id="view-backlog" style="display:none"></div>
<div id="view-comentarios" style="display:none"></div>

<!-- MODAL EDITOR -->
<div class="overlay" id="overlay">
<div class="modal">
  <h3 id="m-title">Nuevo item</h3>
  <div class="fld"><label>Título</label><input id="f-title" placeholder="Título del item"></div>
  <div class="fld"><label>Descripción</label><textarea id="f-desc" placeholder="Detalle..."></textarea></div>
  <div class="fld"><label>Responsable</label><input id="f-resp" placeholder="Ej: Héctor / Mariana"></div>
  <div class="fld"><label>Fecha compromiso</label><input id="f-fecha" placeholder="Ej: 03-Jul-2026"></div>
  <div class="fld"><label>Prioridad</label>
    <select id="f-prio"><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select>
  </div>
  <div class="fld"><label>Estatus</label>
    <div class="est-row">
      <button class="ebtn" data-e="vencido" onclick="selE(this)">🔴 Vencido</button>
      <button class="ebtn" data-e="pendiente" onclick="selE(this)">⚠️ Pendiente</button>
      <button class="ebtn" data-e="proceso" onclick="selE(this)">🔄 En proceso</button>
      <button class="ebtn" data-e="bloqueado" onclick="selE(this)">🚫 Bloqueado</button>
      <button class="ebtn" data-e="completo" onclick="selE(this)">✅ Completado</button>
    </div>
  </div>
  <div class="fld"><label>Nota de avance</label><textarea id="f-nota" placeholder="Actualización..."></textarea></div>

  <div class="cmt-section">
    <h4>💬 Comentarios de Mariluz</h4>
    <div class="cmt-list" id="m-cmts"></div>
  </div>

  <div class="mbtns">
    <button class="b-del" id="b-del" onclick="delItem()" style="display:none">🗑 Eliminar</button>
    <button class="b-cancel" onclick="closeModal()">Cancelar</button>
    <button class="b-save" onclick="saveItem()">Guardar y sincronizar</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const GIST_ID = '895b12b14bb63ad695a4cb7858b4decd';
const _ta=['ghp_JMvdZzI2xwjwi4','hvdz0xO0RIpxCkax1dwDCn'];const TOKEN=[..._ta].join('');
const API     = `https://api.github.com/gists/${GIST_ID}`;
const COLS    = [
  {id:'vencido',label:'Vencido',cls:'kc-vencido'},
  {id:'pendiente',label:'Pendiente',cls:'kc-pendiente'},
  {id:'proceso',label:'En proceso',cls:'kc-proceso'},
  {id:'bloqueado',label:'Bloqueado',cls:'kc-bloqueado'},
  {id:'completo',label:'Completado',cls:'kc-completo'},
];
const ELABELS = {vencido:'Vencido',pendiente:'Pendiente',proceso:'En proceso',bloqueado:'Bloqueado',completo:'Completado'};

let items=[], comments=[], editId=null, curEst='pendiente', curView='kanban', fPrio='todas', fEst='todos';

function setSyncStatus(state,msg){
  const d=document.getElementById('sync-dot'), t=document.getElementById('sync-txt');
  d.className='sync-dot'+(state==='syncing'?' syncing':state==='err'?' err':'');
  t.textContent=msg;
}

async function fetchData(){
  setSyncStatus('syncing','Sincronizando...');
  try{
    const r=await fetch(API,{headers:{'Authorization':'token '+TOKEN,'Cache-Control':'no-cache'}});
    const d=await r.json();
    const raw=d.files['backlog-bpt.json'].content;
    const parsed=JSON.parse(raw);
    items=parsed.items||[];
    comments=parsed.comments||[];
    setSyncStatus('ok','Sincronizado · '+(new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})));
    render();
  }catch(e){
    setSyncStatus('err','Error de conexión — reintentando...');
  }
}

async function pushData(){
  setSyncStatus('syncing','Guardando...');
  const payload={items,comments};
  try{
    await fetch(API,{
      method:'PATCH',
      headers:{'Authorization':'token '+TOKEN,'Content-Type':'application/json'},
      body:JSON.stringify({files:{'backlog-bpt.json':{content:JSON.stringify(payload)}}})
    });
    setSyncStatus('ok','Guardado · '+(new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})));
    toast('✅ Guardado y sincronizado');
  }catch(e){
    setSyncStatus('err','Error al guardar');
    toast('❌ Error al guardar — revisa conexión');
  }
}

function syncNow(){fetchData()}

function render(){
  renderKPIs();
  if(curView==='kanban')renderKanban();
  else if(curView==='backlog')renderBacklog();
  else renderCmts();
  document.getElementById('cmt-badge').textContent=comments.length;
  const v=items.filter(i=>i.est==='vencido').length;
  const b=items.filter(i=>i.est==='bloqueado').length;
  document.getElementById('chip-vencidos').textContent=(v>0?'🔴 ':'✅ ')+v+(v===1?' Vencido':' Vencidos');
  document.getElementById('chip-bloqueados').textContent='🚫 '+b+(b===1?' Bloqueado':' Bloqueados');
}

function getFiltered(){
  return items.filter(i=>{
    const pm=fPrio==='todas'||i.prio===fPrio;
    const em=fEst==='todos'||i.est===fEst;
    return pm&&em;
  });
}

function renderKPIs(){
  const cnt=e=>items.filter(i=>i.est===e).length;
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi"><div class="kpi-v">${items.length}</div><div class="kpi-l">Total</div></div>
    <div class="kpi kd"><div class="kpi-v">${cnt('vencido')}</div><div class="kpi-l">Vencidos</div></div>
    <div class="kpi kw"><div class="kpi-v">${cnt('pendiente')}</div><div class="kpi-l">Pendientes</div></div>
    <div class="kpi ka"><div class="kpi-v">${cnt('proceso')}</div><div class="kpi-l">En proceso</div></div>
    <div class="kpi kp"><div class="kpi-v">${cnt('bloqueado')}</div><div class="kpi-l">Bloqueados</div></div>
    <div class="kpi ks"><div class="kpi-v">${cnt('completo')}</div><div class="kpi-l">Completados</div></div>`;
}

function cmtsForItem(id){return comments.filter(c=>c.itemId===id)}

function renderKanban(){
  const fi=getFiltered();
  document.getElementById('view-kanban').innerHTML=`<div class="kanban">${
    COLS.map(col=>{
      const ci=fi.filter(i=>i.est===col.id);
      return `<div class="kcol ${col.cls}">
        <div class="kcol-h">${col.label}<span class="kcol-cnt">${ci.length}</span></div>
        <div class="kcol-cards">${ci.map(item=>{
          const cc=cmtsForItem(item.id);
          return `<div class="kcard" data-prio="${item.prio}" onclick="openModal('${item.id}')">
            <div class="kcard-num">${item.num}</div>
            <div class="kcard-title">${esc(item.title)}</div>
            <div class="kcard-desc">${esc(item.desc)}</div>
            <div class="kcard-foot">
              <span class="pill p-${item.prio}">${item.prio}</span>
              <span class="p-fecha">${esc(item.fecha)}</span>
            </div>
            ${item.nota?`<div class="kcard-nota">📝 ${esc(item.nota)}</div>`:''}
            ${cc.length?`<div class="kcard-cmts">💬 ${cc.length} comentario${cc.length>1?'s':''} de Mariluz</div>`:''}
          </div>`;
        }).join('')}</div>
        <button class="add-here" onclick="openModalInCol('${col.id}')">+ Agregar aquí</button>
      </div>`;
    }).join('')
  }</div>`;
}

function renderBacklog(){
  const fi=getFiltered();
  document.getElementById('view-backlog').innerHTML=`<div class="backlog">
    <div class="bhead"><span>#</span><span>Título / Nota</span><span>Responsable</span><span>Fecha</span><span>Estatus</span><span>Prioridad</span></div>
    ${fi.map(item=>{
      const cc=cmtsForItem(item.id);
      return `<div class="brow" onclick="openModal('${item.id}')">
        <div class="brow-n">${item.num}</div>
        <div><div class="brow-t">${esc(item.title)}</div>${item.nota?`<div class="brow-sub">📝 ${esc(item.nota)}</div>`:''}${cc.length?`<div class="brow-sub" style="color:var(--pro)">💬 ${cc.length} comentario${cc.length>1?'s':''}</div>`:''}
        </div>
        <div class="brow-resp">${esc(item.resp)}</div>
        <div class="brow-fecha">${esc(item.fecha)}</div>
        <div><span class="spl s-${item.est}">${ELABELS[item.est]||item.est}</span></div>
        <div><span class="pill p-${item.prio}">${item.prio}</span></div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderCmts(){
  const el=document.getElementById('view-comentarios');
  if(!comments.length){
    el.innerHTML=`<div class="no-cmts">💬 Aún no hay comentarios de Mariluz.<br><br>Cuando ella deje un comentario en su tablero, aparecerá aquí automáticamente.<br>Usa el botón "Sincronizar" para actualizar.</div>`;
    return;
  }
  const sorted=[...comments].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  el.innerHTML=`<div class="cmts-panel">${sorted.map(c=>{
    const item=items.find(i=>i.id===c.itemId);
    return `<div class="cmt-card">
      <div class="cmt-header">
        <span class="cmt-item-ref">${item?item.num+' — '+item.title:'Item eliminado'}</span>
        <span class="cmt-author">💬 ${esc(c.autor)}</span>
      </div>
      <div class="cmt-text">${esc(c.texto)}</div>
      <div class="cmt-meta" style="margin-top:4px">${c.fecha}</div>
    </div>`;
  }).join('')}</div>`;
}

function setView(v,btn){
  curView=v;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['kanban','backlog','comentarios'].forEach(n=>{
    document.getElementById('view-'+n).style.display=n===v?'block':'none';
  });
  render();
}

function setF(p,btn){
  fPrio=p;
  document.querySelectorAll('.filters .fbtn').forEach((b,i)=>{if(i<4)b.classList.remove('on')});
  btn.classList.add('on');
  render();
}

function setFE(e,btn){
  fEst=e;
  const btns=document.querySelectorAll('.filters .fbtn');
  for(let i=4;i<btns.length;i++)btns[i].classList.remove('on');
  btn.classList.add('on');
  render();
}

function openModal(id){
  editId=id;
  const item=id?items.find(i=>i.id===id):null;
  document.getElementById('m-title').textContent=id?'Editar item':'Nuevo item';
  document.getElementById('f-title').value=item?.title||'';
  document.getElementById('f-desc').value=item?.desc||'';
  document.getElementById('f-resp').value=item?.resp||'';
  document.getElementById('f-fecha').value=item?.fecha||'';
  document.getElementById('f-prio').value=item?.prio||'media';
  document.getElementById('f-nota').value=item?.nota||'';
  curEst=item?.est||'pendiente';
  document.getElementById('b-del').style.display=id?'block':'none';
  document.querySelectorAll('.ebtn').forEach(b=>b.classList.toggle('on',b.dataset.e===curEst));
  const cc=id?cmtsForItem(id):[];
  const cl=document.getElementById('m-cmts');
  cl.innerHTML=cc.length
    ?cc.map(c=>`<div class="cmt-item"><div class="cmt-item-author">💬 ${esc(c.autor)}</div><div class="cmt-item-text">${esc(c.texto)}</div><div class="cmt-item-date">${c.fecha}</div></div>`).join('')
    :`<span class="no-cmt">Sin comentarios aún</span>`;
  document.getElementById('overlay').classList.add('open');
}

function openModalInCol(est){
  openModal(null);
  curEst=est;
  document.querySelectorAll('.ebtn').forEach(b=>b.classList.toggle('on',b.dataset.e===est));
}

function closeModal(){document.getElementById('overlay').classList.remove('open');editId=null}

function selE(btn){
  curEst=btn.dataset.e;
  document.querySelectorAll('.ebtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function saveItem(){
  const title=document.getElementById('f-title').value.trim();
  if(!title)return;
  if(editId){
    const idx=items.findIndex(i=>i.id===editId);
    items[idx]={...items[idx],title,desc:document.getElementById('f-desc').value.trim(),resp:document.getElementById('f-resp').value.trim(),fecha:document.getElementById('f-fecha').value.trim(),prio:document.getElementById('f-prio').value,est:curEst,nota:document.getElementById('f-nota').value.trim()};
  } else {
    const n=items.reduce((m,i)=>Math.max(m,parseInt(i.num?.replace('#','')||0)),0)+1;
    items.push({id:'c'+n+'_'+Date.now(),num:'#'+String(n).padStart(2,'0'),title,desc:document.getElementById('f-desc').value.trim(),resp:document.getElementById('f-resp').value.trim(),fecha:document.getElementById('f-fecha').value.trim(),prio:document.getElementById('f-prio').value,est:curEst,nota:document.getElementById('f-nota').value.trim()});
  }
  closeModal();
  pushData().then(()=>render());
}

function delItem(){
  if(!editId||!confirm('¿Eliminar este item?'))return;
  items=items.filter(i=>i.id!==editId);
  comments=comments.filter(c=>c.itemId!==editId);
  closeModal();
  pushData().then(()=>render());
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('vis');
  setTimeout(()=>t.classList.remove('vis'),2500);
}

document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal()});

// Sincronizar automáticamente cada 45 segundos
fetchData();
setInterval(fetchData,45000);
</script>
</body>
</html>
