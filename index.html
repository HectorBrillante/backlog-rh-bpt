, "est": "pendiente", "nota": ""}, {"id": "c16", "num": "#16", "title": "Procedimientos → generación de políticas", "desc": "Procedimiento RH-PRO-GEN-001 ya existe. Dar seguimiento al flujo completo.", "resp": "Héctor", "fecha": "Esta semana", "prio": "media", "est": "pendiente", "nota": ""}, {"id": "c17", "num": "#17", "title": "Clima laboral — avance y retroalimentación", "desc": "Encuesta enviada semana pasada. Sistema entrevistas salida ya listo.", "resp": "Héctor", "fecha": "Jue 2-Jul", "prio": "media", "est": "proceso", "nota": ""}, {"id": "c18", "num": "#18", "title": "Entrevista de salida por link — activar", "desc": "Sistema ya construido. Definir qué falta para activarlo.", "resp": "Héctor / Mariana", "fecha": "Jue 2-Jul", "prio": "media", "est": "pendiente", "nota": ""}, {"id": "c19", "num": "#19", "title": "KPIs Sistemas — proponer auxiliar", "desc": "Armar propuesta de perfil + justificación para Mariluz antes del viernes.", "resp": "Héctor → Mariluz", "fecha": "Vie 3-Jul", "prio": "media", "est": "pendiente", "nota": ""}, {"id": "c20", "num": "#20", "title": "Sueldos Mantenimiento/Calidad vs Op. Llenadora Sindical", "desc": "Comparar tabulador y detectar brechas salariales.", "resp": "Héctor", "fecha": "Jue 2-Jul", "prio": "media", "est": "pendiente", "nota": ""}, {"id": "c21", "num": "#21", "title": "Revisión RIT — reformas + Ley Silla", "desc": "RIT depositada JLCA Puebla abr-2019. Actualizar con reformas 2024-2026.", "resp": "Héctor / Mariana", "fecha": "Vie 3-Jul", "prio": "media", "est": "pendiente", "nota": ""}, {"id": "c22", "num": "#22", "title": "Acuerdos Procedimiento Rutas ACU-01 al ACU-08", "desc": "ACU-06 y ACU-07 vencen 4-Jul. Héctor responsable ACU-01 (7-Jul), ACU-08 (11-Jul).", "resp": "Héctor + Reynol", "fecha": "04-Jul", "prio": "alta", "est": "pendiente", "nota": ""}];

async function fetchData(){
  ss('sy','Cargando datos...');
  try{
    // Usar API con token para leer — siempre la versión más reciente
    const r=await fetch(API,{headers:{'Authorization':'token '+TOKEN,'Cache-Control':'no-cache'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    const raw=d.files['backlog-bpt.json'].content;
    const p=JSON.parse(raw);
    items=p.items&&p.items.length>0?p.items:DEFAULT;
    comments=p.comments||[];
    ss('ok','Sincronizado · '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}));
    render();
  }catch(e){
    ss('er','Sin conexión — mostrando datos locales');
    if(items.length===0){items=DEFAULT;comments=[];render();}
  }
}

async function pushData(){
  ss('sy','Guardando...');
  try{
    const r=await fetch(API,{method:'PATCH',headers:{'Authorization':'token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({files:{'backlog-bpt.json':{content:JSON.stringify({items,comments})}}})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    ss('ok','Guardado · '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}));
    toast('✅ Guardado y sincronizado');
    return true;
  }catch(e){ss('er','Error al guardar');toast('❌ Error al guardar');return false;}
}

function syncNow(){fetchData()}

function render(){
  renderKPI();
  if(vw==='k')renderK();else if(vw==='b')renderB();else renderC();
  document.getElementById('cbadge').textContent=comments.length;
  const v=items.filter(i=>i.est==='vencido').length;
  const b=items.filter(i=>i.est==='bloqueado').length;
  document.getElementById('ch-v').textContent=(v>0?'🔴 ':'✅ ')+v+(v===1?' Vencido':' Vencidos');
  document.getElementById('ch-b').textContent='🚫 '+b+(b===1?' Bloqueado':' Bloqueados');
}

function gf(){return items.filter(i=>(fp==='todas'||i.prio===fp)&&(fe==='todos'||i.est===fe));}

function renderKPI(){
  const c=e=>items.filter(i=>i.est===e).length;
  document.getElementById('kpi').innerHTML=`<div class="kp"><div class="kv">${items.length}</div><div class="kl">Total</div></div><div class="kp kd"><div class="kv">${c('vencido')}</div><div class="kl">Vencidos</div></div><div class="kp kw"><div class="kv">${c('pendiente')}</div><div class="kl">Pendientes</div></div><div class="kp ka"><div class="kv">${c('proceso')}</div><div class="kl">En proceso</div></div><div class="kp kpp"><div class="kv">${c('bloqueado')}</div><div class="kl">Bloqueados</div></div><div class="kp ks"><div class="kv">${c('completo')}</div><div class="kl">Completados</div></div>`;
}

function cfi(id){return comments.filter(c=>c.itemId===id);}

function renderK(){
  const fi=gf();
  document.getElementById('vk').innerHTML=`<div class="kb">${COLS.map(col=>{
    const ci=fi.filter(i=>i.est===col.id);
    return `<div class="kc ${col.c}"><div class="kch">${col.l}<span class="kcc">${ci.length}</span></div><div class="kcs">${ci.map(item=>{
      const cc=cfi(item.id);
      return `<div class="kk" data-p="${item.prio}" onclick="openM('${item.id}')"><div class="kn">${item.num}</div><div class="kt">${e(item.title)}</div><div class="kd2">${e(item.desc)}</div><div class="kf"><span class="pi p${item.prio[0]}">${item.prio}</span><span class="pf">${e(item.fecha)}</span></div>${item.nota?`<div class="kno">📝 ${e(item.nota)}</div>`:''}${cc.length?`<div class="kcm">💬 ${cc.length} comentario${cc.length>1?'s':''}</div>`:''}`;
    }).join('')}</div><button class="ah" onclick="openMC('${col.id}')">+ Agregar aquí</button></div>`;
  }).join('')}</div>`;
}

function renderB(){
  const fi=gf();
  document.getElementById('vb').innerHTML=`<div class="bl"><div class="bh"><span>#</span><span>Título / Nota</span><span>Responsable</span><span>Fecha</span><span>Estatus</span><span>Prior.</span></div>${fi.map(item=>{const cc=cfi(item.id);return `<div class="br" onclick="openM('${item.id}')"><div class="bn">${item.num}</div><div><div class="bt">${e(item.title)}</div>${item.nota?`<div class="bsub">📝 ${e(item.nota)}</div>`:''}${cc.length?`<div class="bsubc">💬 ${cc.length} comentario${cc.length>1?'s':''}</div>`:''}></div><div class="bres">${e(item.resp)}</div><div class="bfe">${e(item.fecha)}</div><div><span class="spl s${item.est[0]==='p'?'pe':item.est[0]==='b'&&item.est[1]==='l'?'bl':item.est[0]}">${EL[item.est]||item.est}</span></div><div><span class="pi p${item.prio[0]}">${item.prio}</span></div></div>`;
  }).join('')}</div>`;
}

function renderC(){
  const el=document.getElementById('vc');
  if(!comments.length){el.innerHTML='<div class="nc">💬 Sin comentarios aún.<br>Cuando Mariluz deje uno aparecerá aquí.<br>Usa el botón Sincronizar para actualizar.</div>';return;}
  const s=[...comments].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  el.innerHTML=`<div class="cp2">${s.map(c=>{const it=items.find(i=>i.id===c.itemId);return `<div class="cc2"><div class="cch"><span class="ccr">${it?it.num+' — '+e(it.title):'Item eliminado'}</span><span class="cca">💬 ${e(c.autor)}</span></div><div class="cct">${e(c.texto)}</div><div class="ccm">${c.fecha}</div></div>`;
  }).join('')}</div>`;
}

function setV(v,btn){
  vw=v;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('vk').style.display=v==='k'?'block':'none';
  document.getElementById('vb').style.display=v==='b'?'block':'none';
  document.getElementById('vc').style.display=v==='c'?'block':'none';
  render();
}
function setFP(p,btn){fp=p;document.querySelectorAll('.fi .fb').forEach((b,i)=>{if(i<4)b.classList.remove('on')});btn.classList.add('on');render();}
function setFE(ev,btn){fe=ev;const bs=document.querySelectorAll('.fi .fb');for(let i=4;i<bs.length;i++)bs[i].classList.remove('on');btn.classList.add('on');render();}

function openM(id){
  eid=id;
  const it=id?items.find(i=>i.id===id):null;
  document.getElementById('mtit').textContent=id?'Editar item':'Nuevo item';
  document.getElementById('ft').value=it?.title||'';
  document.getElementById('fd2').value=it?.desc||'';
  document.getElementById('fr').value=it?.resp||'';
  document.getElementById('ff').value=it?.fecha||'';
  document.getElementById('fp').value=it?.prio||'media';
  document.getElementById('fn').value=it?.nota||'';
  est=it?.est||'pendiente';
  document.getElementById('bdel').style.display=id?'block':'none';
  document.querySelectorAll('.eb').forEach(b=>b.classList.toggle('on',b.dataset.e===est));
  const cc=id?cfi(id):[];
  document.getElementById('mcl').innerHTML=cc.length?cc.map(c=>`<div class="ci"><div class="cia">💬 ${e(c.autor)}</div><div class="cit">${e(c.texto)}</div><div class="cid">${c.fecha}</div></div>`).join(''):`<span class="noc">Sin comentarios aún</span>`;
  document.getElementById('ov').classList.add('op');
}
function openMC(e2){openM(null);est=e2;document.querySelectorAll('.eb').forEach(b=>b.classList.toggle('on',b.dataset.e===e2));}
function closeM(){document.getElementById('ov').classList.remove('op');eid=null;}
function selE(btn){est=btn.dataset.e;document.querySelectorAll('.eb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

function saveI(){
  const t=document.getElementById('ft').value.trim();
  if(!t)return;
  if(eid){
    const ix=items.findIndex(i=>i.id===eid);
    items[ix]={...items[ix],title:t,desc:document.getElementById('fd2').value.trim(),resp:document.getElementById('fr').value.trim(),fecha:document.getElementById('ff').value.trim(),prio:document.getElementById('fp').value,est,nota:document.getElementById('fn').value.trim()};
  }else{
    const n=items.reduce((m,i)=>Math.max(m,parseInt(i.num?.replace('#','')||0)),0)+1;
    items.push({id:'c'+n+'_'+Date.now(),num:'#'+String(n).padStart(2,'0'),title:t,desc:document.getElementById('fd2').value.trim(),resp:document.getElementById('fr').value.trim(),fecha:document.getElementById('ff').value.trim(),prio:document.getElementById('fp').value,est,nota:document.getElementById('fn').value.trim()});
  }
  closeM();
  pushData().then(()=>render());
}
function delI(){
  if(!eid||!confirm('¿Eliminar este item?'))return;
  items=items.filter(i=>i.id!==eid);
  comments=comments.filter(c=>c.itemId!==eid);
  closeM();
  pushData().then(()=>render());
}
function e(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const t=document.getElementById('to');t.textContent=m;t.classList.add('vi');setTimeout(()=>t.classList.remove('vi'),2500);}

document.getElementById('ov').addEventListener('click',ev=>{if(ev.target===document.getElementById('ov'))closeM();});
fetchData();
setInterval(fetchData,45000);
</script>
</body>
</html>
